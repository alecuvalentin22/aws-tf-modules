name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: "1.15.9"
  CHECKPOINT_DISABLE: "1"
  # No AWS credentials are configured anywhere in this workflow, on purpose.
  # Every check below is static or runs against a mocked provider. A pipeline that
  # needs credentials to tell you your Terraform is wrong is a pipeline that will be
  # switched off the first time the credentials expire.

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/backup-policy
          - modules/backup-policy/modules/backup-vault
          - modules/backup-policy/examples/minimal
          - modules/backup-policy/examples/complete
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

  test:
    name: terraform test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/backup-policy
          - modules/backup-policy/modules/backup-vault
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -input=false
        working-directory: ${{ matrix.dir }}
      # Runs against mock_provider: no AWS account, no credentials.
      - run: terraform test -no-color
        working-directory: ${{ matrix.dir }}

  policies:
    name: policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install parliament
      # A gate rather than advisory, unlike the two below: this one has actually
      # been run, and it self-tests against known-bad fixtures before reporting,
      # so a green result means the linter was working when it produced it.
      - run: python scripts/lint_policies.py

  # tflint and checkov are ADVISORY, not gates.
  #
  # Both pull rulesets from the network at run time, so neither could be executed
  # in the environment this repository was developed in, and a check that has
  # never been run is not something to make required. They also both flag
  # deliberate decisions here -- vaults without force_destroy, an SNS topic whose
  # key policy names service principals -- which would mean either a permanently
  # red pipeline or a pile of inline suppressions.
  #
  # The authoritative gates are fmt, validate and test, all of which run offline
  # against a mocked provider and have actually been executed.
  lint:
    name: tflint (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --format compact

  security:
    name: checkov (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: modules
          framework: terraform
          quiet: true
          soft_fail: true

  python:
    name: lambda unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No boto3 and no credentials: the rule's decision logic takes its AWS access
      # through injected callables precisely so it is testable without them.
      - run: |
          python -m unittest discover \
            -s lambdas/kms-rotation-compliance/tests \
            -t lambdas/kms-rotation-compliance -v

  confidentiality:
    name: no client identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repository is a portfolio artefact. Client names must never appear in it,
      # so the check is enforced rather than remembered.
      - name: grep for client identifiers
        run: |
          # The pattern is assembled from fragments so that this step does not
          # itself contain the names it is looking for -- otherwise the check
          # fails on its own source and has to be excluded from its own scan.
          PATTERN="alli""anz|euler[- ]?her""mes"
          if grep -riEn "$PATTERN" --exclude-dir=.git --exclude-dir=.terraform . ; then
            echo "::error::client identifier found in the repository"
            exit 1
          fi
          echo "clean"
